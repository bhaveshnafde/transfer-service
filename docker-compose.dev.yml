# Local development only: the Transfer service's own PostgreSQL database.
# docker compose -f docker-compose.dev.yml up -d
#
# Host port 5433 so it does not clash with a locally installed Postgres or another service's DB.
# Assignment 2 will replace this with the team's full compose file / Kubernetes manifests.
services:
  transfer-db:
    image: postgres:16
    environment:
      POSTGRES_DB: transfer_db
      POSTGRES_USER: transfer_user
      POSTGRES_PASSWORD: transfer_pass
    ports:
      - "5433:5432"
    volumes:
      - transfer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfer_user -d transfer_db"]
      interval: 5s
      retries: 10

volumes:
  transfer-db-data:
