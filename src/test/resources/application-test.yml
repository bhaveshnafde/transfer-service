# In-memory H2 in PostgreSQL mode, so `mvn test` needs no database.
spring:
  datasource:
    url: jdbc:h2:mem:transfer_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

transfer:
  recovery:
    enabled: false
  retry:
    base-delay: 10ms
    max-delay: 20ms

logging:
  structured:
    format:
      console: logstash
